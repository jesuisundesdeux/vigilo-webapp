server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Relative redirects: the app may be served under a path by a proxy (/webapp/)
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
    # Hashed file names: cached for good; index.html and config.json always checked
    location ~* \.(js|css|woff2?|ttf|eot|png|jpe?g|gif|svgz?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /config.json {
        add_header Cache-Control "no-cache";
    }
}
