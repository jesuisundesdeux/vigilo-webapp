<div class="stats-page">
  <div class="stats-head">
    <h5 data-i18n="stats">Statistiques</h5>
    <div class="stats-periods" role="group" data-i18n-attr='{"aria-label": "stats-period"}' aria-label="Période">
      <button type="button" data-period="30d" data-i18n="stats-period-30d">30 jours</button>
      <button type="button" data-period="12m" class="active" data-i18n="stats-period-12m">12 mois</button>
      <button type="button" data-period="all" data-i18n="stats-period-all">Tout</button>
    </div>
  </div>

  <div class="stats-kpis">
    <div class="stats-tile" id="stats-kpi-total">
      <span class="stats-tile-label" data-i18n="stats-total">Observations</span>
      <span class="stats-tile-value">…</span>
      <span class="stats-tile-sub"></span>
    </div>
    <div class="stats-tile" id="stats-kpi-trend">
      <span class="stats-tile-label" data-i18n="stats-evolution">Évolution</span>
      <span class="stats-tile-value">…</span>
      <span class="stats-tile-sub"></span>
    </div>
    <div class="stats-tile" id="stats-kpi-published">
      <span class="stats-tile-label" data-i18n="stats-published">Publiées</span>
      <span class="stats-tile-value">…</span>
      <span class="stats-tile-sub"></span>
    </div>
    <div class="stats-tile" id="stats-kpi-resolved">
      <span class="stats-tile-label" data-i18n="stats-resolved">Résolues</span>
      <span class="stats-tile-value">…</span>
      <span class="stats-meter"><span></span></span>
      <span class="stats-tile-sub"></span>
    </div>
  </div>

  <section class="stats-card" id="stats-trend">
    <h6 data-i18n="stats-trend">Observations dans le temps</h6>
    <p class="stats-card-sub"></p>
    <div class="stats-chart"><canvas></canvas></div>
  </section>

  <div class="stats-columns">
    <section class="stats-card" id="stats-categories">
      <h6 data-i18n="categories">Catégories</h6>
      <p class="stats-card-sub"></p>
      <ol class="stats-ranking"></ol>
    </section>
    <section class="stats-card" id="stats-status">
      <h6 data-i18n="status">Statut</h6>
      <p class="stats-card-sub"></p>
      <div class="stats-stack" role="img"></div>
      <ul class="stats-legend"></ul>
    </section>
  </div>

  <section class="stats-card" id="stats-heatmap">
    <h6 data-i18n="stats-when">Jours et heures des observations</h6>
    <p class="stats-card-sub"></p>
    <div class="stats-heat" role="img"></div>
    <div class="stats-heat-scale"><span data-i18n="stats-less">Moins</span><i></i><i></i><i></i><i></i><i></i><i></i><span data-i18n="stats-more">Plus</span></div>
  </section>

  <div class="stats-tip" role="tooltip" hidden></div>
</div>
