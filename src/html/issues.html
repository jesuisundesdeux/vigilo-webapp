<ul class="tabs row">
  <li class="tab col s6"><a class="yellow-text text-darken-3 active" href="#issues-list" data-i18n="list">Liste</a></li>
  <li class="tab col s6"><a class="yellow-text text-darken-3" href="#issues-map" data-i18n="map">Carte</a></li>
</ul>
<div id="issues-list" class="row">
  <div class="col s12">
    <div class="cards-container">
      ${require('./spinner.html')}
    </div>
  </div>
</div>
<div id="issues-map">
  <div class="map-loading" aria-hidden="true"><span></span></div>
</div>
<div class="fixed-action-btn">
  <a title="Filtrer" data-i18n-attr='{"title": "filter-issues"}' class="btn-floating btn-large blue darken-1 black-text modal-trigger" href="#modal-filters">
    <i class="material-icons">filter_list</i>
  </a>
  <!-- Mobile only: photo drafts with the phone's position (see js/photo-drafts.js) -->
  <a id="drafts-btn" title="Brouillons" data-i18n-attr='{"title": "drafts", "aria-label": "drafts"}' class="btn-floating white black-text modal-trigger hide" href="#modal-drafts">
    <i class="material-icons">photo_library</i><span class="drafts-count"></span>
  </a>
  <a id="draft-camera-btn" title="Photo en brouillon" data-i18n-attr='{"title": "drafts-take-photo", "aria-label": "drafts-take-photo"}' class="btn-floating btn-large white black-text hide" href="#!">
    <i class="material-icons">photo_camera</i>
  </a>
  <input id="draft-camera-input" type="file" accept="image/*" capture="environment" style="display: none">
  <a title="Ajouter une observation" data-i18n-attr='{"title": "add-issue"}' class="btn-floating btn-large yellow darken-3 black-text" onclick="startForm()">
    <i class="material-icons">add</i>
  </a>

  <!-- Modal for filters -->
  ${require('./filters.html')}
</div>
